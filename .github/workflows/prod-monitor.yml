name: Prod Monitor

# Daily synthetic monitor for the LIVE site (https://campable.co).
#
# Distinct from playwright.yml, which is a release GATE: it deploys dev HEAD to
# staging and tests that before promotion. This workflow tests PRODUCTION as it
# actually is, so a Fly outage / TLS expiry / Supabase incident is caught even
# when no real user is around. It performs ZERO mutations (no signup, Stripe,
# or writes) — see e2e/tests/prod-smoke.spec.ts.
#
# Layering (see docs/MONITORING.md):
#   UptimeRobot  -> "is it down?"        every 5 min  (external, /healthz)
#   THIS         -> "do features work?"  daily        (deep, read-only)
#   playwright   -> "is the next release safe?"  pre-deploy (staging)
#   PostHog      -> passive real-user error capture

on:
  schedule:
    - cron: "0 15 * * *" # daily 15:00 UTC (offset from the 08:00 release gate)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PROD_URL: https://campable.co

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Healthz — app + DB readiness
        run: |
          body=$(curl -sf --max-time 30 "$PROD_URL/healthz") || {
            echo "::error::/healthz did not return 2xx"; exit 1; }
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || {
            echo "::error::/healthz not ok (DB degraded or route not yet deployed)"; exit 1; }

      - name: Search API — DB + provider pipeline
        run: |
          start=$(date -u -d "+30 days" +%Y-%m-%d)
          end=$(date -u -d "+33 days" +%Y-%m-%d)
          url="$PROD_URL/api/search?start_date=$start&end_date=$end&state=WA&nights=2&limit=5"
          body=$(curl -sf --max-time 60 "$url") || {
            echo "::error::/api/search did not return 2xx"; exit 1; }
          echo "$body" | grep -q '"campgrounds_checked"' || {
            echo "::error::/api/search response missing campgrounds_checked"; exit 1; }

      - name: WA State Parks availability — prod's own view
        # /api/check runs in the prod process, through its provider client and
        # Fly's egress IP. The dependency sweep below runs from this runner, so
        # it cannot see a provider blocking Fly: in Nov 2026 GoingToCamp 403'd
        # every WA request from prod while the sweep here reported ok. A single
        # park, so no rec.gov calls. Oregon is not gated here until #131 lands.
        run: |
          start=$(date -u -d "+45 days" +%Y-%m-%d)
          end=$(date -u -d "+47 days" +%Y-%m-%d)
          url="$PROD_URL/api/check/-2147483646?start_date=$start&end_date=$end&source=wa_state"
          body=$(curl -sf --max-time 60 "$url") || {
            echo "::error::/api/check (wa_state) did not return 2xx"; exit 1; }
          err=$(echo "$body" | jq -r '.error // empty')
          if [ -n "$err" ]; then
            echo "::error::WA State Parks availability failing in prod: $err"; exit 1
          fi
          echo "wa_state ok: $(echo "$body" | jq -r '.name')"

      # always(): the sweep explains a failure, so it must run when a
      # detector above has failed — that is when it is needed.
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.12"

      - name: Dependency sweep — which upstream is down?
        if: always()
        env:
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        # DIAGNOSTIC, NOT A GATE — deliberately continue-on-error. This runs
        # from a GitHub runner, so a provider that blocks GitHub's IP range
        # would fail here while prod is perfectly healthy. The steps above are
        # the detectors; this explains them. Its result lands in the run summary
        # so a failed monitor is diagnosable without opening the artifact.
        #
        # Scoped to provider+notify: the platform checks (Supabase, Stripe,
        # PostHog) key off Fly secrets, so run the full sweep on the box:
        #   fly ssh console -a campnw -C "python -m pnw_campsites doctor"
        # Checks whose keys are absent report "skip", never "fail".
        continue-on-error: true
        run: |
          pip install -e ".[api]"
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          python -m pnw_campsites doctor --only provider,notify --json \
            > dependency-sweep.json || true
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = json.loads(pathlib.Path("dependency-sweep.json").read_text())
          icon = {"ok": "✅", "slow": "🐢", "fail": "❌", "skip": "⏭️"}
          print(f"### Dependency sweep — {report['status']}\n")
          print("| | Dependency | Latency | Detail |")
          print("|---|---|---|---|")
          for c in report["checks"]:
              ms = f"{c['latency_ms']:,}ms" if c["latency_ms"] is not None else "—"
              print(f"| {icon[c['status']]} | {c['name']} | {ms} | {c['error'] or c['detail']} |")
          PY
          cat dependency-sweep.json

      - name: Upload dependency sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sweep
          path: dependency-sweep.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Install Playwright + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run read-only prod smoke
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.PROD_URL }}
          CI: "true"
        run: npx playwright test prod-smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-monitor-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Email alert on failure (Resend)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_EMAIL_TO" ]; then
            echo "::warning::Resend not configured (RESEND_API_KEY / ALERT_EMAIL_TO); skipping email"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          from="${ALERT_EMAIL_FROM:-Campable Monitor <alerts@campable.co>}"
          date_str=$(date -u +%Y-%m-%d)
          text=$(printf 'The daily production monitor failed. A feature on the live site may be down.\n\nRun: %s\n\nThe Playwright report + trace are attached to the run as an artifact.' "$run_url")
          payload=$(jq -n \
            --arg from "$from" \
            --arg to "$ALERT_EMAIL_TO" \
            --arg subject "🔴 campable.co prod monitor FAILED ($date_str)" \
            --arg text "$text" \
            '{from: $from, to: [$to], subject: $subject, text: $text}')
          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          # One open issue per outage, not one per day: a multi-day outage
          # used to open a fresh issue every run (#157-#162 for one cause).
          # While a prod-down issue is open, later failures comment on it.
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'prod-down',
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing on ${date}.\n\nRun: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Prod monitor FAILED — campable.co (since ${date})`,
              body: `The daily production synthetic monitor failed — a live feature may be down.\n\nRun: ${runUrl}\n\nThe Playwright HTML report + trace are attached as the run's artifact. Later failures are added here as comments until this issue is closed.`,
              labels: ['prod-down'],
            });
