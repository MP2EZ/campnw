name: Playwright E2E

# Runs Playwright flows against a deployed campable instance.
# PR: upgrade smoke flow only (~60s). Nightly: all four flows.
#
# Self-hosted on GitHub Actions runners — $0/mo until Pro revenue
# justifies adding paid parallelism.
#
# Required repo secrets:
#   FLY_API_TOKEN                       (Fly preview deploy + ssh)
#   E2E_FIXTURE_PASSWORD                (shared password for fixture users)
#   SUPABASE_SERVICE_ROLE_KEY           (admin JWT for fixture seeding)
#   VITE_PUBLIC_SUPABASE_URL            (existing — reused for fixture seeding)

on:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 8 * * *'   # nightly 08:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@63da3ecc5e2793b98a3f2519b3d75d4f4c11cec2

      - name: Deploy Fly preview
        id: preview
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="campnw-pr-${{ github.event.pull_request.number || 'manual' }}"
          flyctl deploy --remote-only --app "$APP_NAME" || flyctl launch \
            --copy-config --name "$APP_NAME" --org personal --region sjc --now
          PREVIEW_URL="https://${APP_NAME}.fly.dev"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$PREVIEW_URL/healthz"; then
              echo "Preview ready at $PREVIEW_URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview never became healthy"
          exit 1

      - name: Seed E2E fixtures
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="campnw-pr-${{ github.event.pull_request.number || 'manual' }}"
          flyctl ssh console -a "$APP_NAME" -C "python scripts/seed_e2e_fixtures.py" \
            -e SUPABASE_URL="${{ secrets.VITE_PUBLIC_SUPABASE_URL }}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -e E2E_FIXTURE_PASSWORD="${{ secrets.E2E_FIXTURE_PASSWORD }}"

      - name: Install Playwright + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke flow
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
          CI: "true"
        run: npx playwright test tests/upgrade.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: e2e/playwright-report/
          retention-days: 14

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@63da3ecc5e2793b98a3f2519b3d75d4f4c11cec2

      - name: Seed fixtures against staging
        working-directory: .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a campnw-staging -C "python scripts/seed_e2e_fixtures.py" \
            -e SUPABASE_URL="${{ secrets.VITE_PUBLIC_SUPABASE_URL }}" \
            -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -e E2E_FIXTURE_PASSWORD="${{ secrets.E2E_FIXTURE_PASSWORD }}"

      - name: Install Playwright + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run all flows
        env:
          E2E_BASE_URL: https://campnw-staging.fly.dev
          E2E_FIXTURE_PASSWORD: ${{ secrets.E2E_FIXTURE_PASSWORD }}
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: e2e/playwright-report/
          retention-days: 30

      - name: Open issue on nightly failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly Playwright E2E failed (${date})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe Playwright HTML report + trace are attached as the run's artifact.`,
              labels: ['e2e-failure'],
            });
