name: PR Checks

on:
  pull_request:
    branches: [main, dev]
  push:
    # Also run on direct pushes so commits that bypass PRs get the same checks
    # (security scan, lighthouse, bundle-size enforcement, frontend tests).
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check src/

      - name: Run tests
        run: pytest --cov --cov-report=term -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend type check
        working-directory: web
        run: |
          npm ci
          npx tsc -b

      - name: Frontend tests
        working-directory: web
        run: npx vitest run --coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python CVE scan
        run: |
          # Upgrade pip first — the pip version pre-installed by setup-python
          # lags actual CVE patches (e.g. CVE-2026-6357 fixed in pip 26.1).
          # Without this, pip-audit flags pip itself, regardless of project deps.
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e ".[api]"
          # CVE-2026-3219: pip vulnerability with no patched version available yet.
          # Revisit periodically — when pip-audit reports a Fix Version, drop the ignore.
          pip-audit --ignore-vuln CVE-2026-3219

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm CVE scan
        working-directory: web
        run: |
          npm ci
          # GHSA-qwww-vcr4-c8h2 (react-router): CSRF bypass that the advisory
          # states is reachable only through the unstable RSC APIs. Campable is
          # a client-only SPA — src/main.tsx uses plain BrowserRouter, with no
          # RSC, no data-router action/loader, no server runtime — so the
          # vulnerable path cannot be reached. npm's only offered fix is a
          # downgrade to react-router-dom@7.11.0; the real fix is React Router 8,
          # which folds react-router-dom into react-router (an import migration).
          # Revisit when that migration is scheduled.
          #
          # Pipe-separate to allowlist more advisories. Anything high/critical
          # that is NOT listed here still fails the build.
          ALLOWED='GHSA-qwww-vcr4-c8h2'

          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          UNEXPECTED=$(jq -r '
            [ .vulnerabilities[]
              | select(.severity == "high" or .severity == "critical")
              | .via[] | objects | .url
            ] | unique | .[]' "$RUNNER_TEMP/audit.json" \
            | grep -vE "$ALLOWED" || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unallowlisted high/critical npm advisories found:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "No unallowlisted high/critical npm advisories."

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.js
          uploadArtifacts: true

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check bundle size
        run: |
          MAIN_SIZE=$(stat -c%s web/dist/assets/index-*.js 2>/dev/null || stat -f%z web/dist/assets/index-*.js)
          echo "Main chunk: $((MAIN_SIZE / 1024))KB"
          if [ "$MAIN_SIZE" -gt 358400 ]; then
            echo "::error::Main JS chunk exceeds 350KB limit ($((MAIN_SIZE / 1024))KB)"
            exit 1
          fi
