# Phase 0 spike — Maestro Web viability against current prod (campable.co).
#
# Uses CSS selectors that match the CURRENT deployed code (no data-testid
# additions yet). Validates that Maestro Web actually drives a browser,
# can navigate, can open modals, and can interact with form fields.
#
# Run:
#   maestro test -p web .maestro/spike.yaml
#
# Pass criterion: all steps run without selector-not-found errors.

url: https://campable.co
---
- launchApp

- assertVisible: "Sign in"
- tapOn: "Sign in"

# Inputs in current prod have no id/data-testid — match by HTML type.
- assertVisible:
    css: 'input[type="email"]'
- assertVisible:
    css: 'input[type="password"]'

# Switch to signup mode
- tapOn: "Create one"

# Type into all three inputs (cross-origin / dynamic form interaction)
- inputText:
    css: 'input[autocomplete="name"]'
    text: "Maestro Spike"
- inputText:
    css: 'input[type="email"]'
    text: "spike-${MAESTRO_RUN_ID}@maestro.test"
- inputText:
    css: 'input[type="password"]'
    text: "SpikeTest1234!"

# Don't submit — we don't want to create a real auth user.
# If we got here, Maestro Web is viable.
