# Flow 3 — Trip planner session limit enforcement.
#
# Free fixture user already has 3 planner sessions this month → 4th attempt
# opens UpgradeModal with reason=planner_limit.
#
# Requires fixture: maestro-fixture-free-3planner@maestro.test seeded via
# scripts/seed_maestro_fixtures.sql

url: ${MAESTRO_BASE_URL}
---
- launchApp

- tapOn: "Sign in"
- inputText:
    css: '[data-testid="email-input"]'
    text: "${MAESTRO_FIXTURE_PREFIX}free-3planner@maestro.test"
- inputText:
    css: '[data-testid="password-input"]'
    text: ${MAESTRO_FIXTURE_PASSWORD}
- tapOn: "Sign in"

- openLink: ${MAESTRO_BASE_URL}/plan
- inputText:
    css: '#chat-input'
    text: "Find me a lakeside spot near Seattle next weekend"
- tapOn: "Send"

# 4th session → 402 → UpgradeModal
- extendedWaitUntil:
    visible: "Upgrade for more trip planner sessions"
    timeout: 10000
- assertVisible: "Free accounts get 3 trip planner sessions per month"
